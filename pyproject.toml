[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-study"
version = "0.1.0"
description = "Does news and social sentiment predict short-term stock moves? A rigorous FinBERT vs VADER test."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.1",
    "yfinance>=0.2.40",
    "vaderSentiment==3.3.2",
    "feedparser>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
